services:
  - type: web
    name: tibia-character-verification
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TIBIA_DATA_DIR
        value: /tmp/tibia-verify
      - key: PRODUCTION
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TIBIADATA_URL
        value: https://api.tibiadata.com/v5
