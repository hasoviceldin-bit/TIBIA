services:
  - type: web
    name: tibia-character-verification-preview
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: cd tibia-verifier && python unpack.py && python fix_v5.py && pip install -r requirements.txt
    startCommand: cd tibia-verifier && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TIBIADATA_URL
        value: https://api.tibiadata.com/v5
      - key: INTEL_RELEASE
        value: "2026-11-27-pvp-transfers"
